name: Build and deploy Godot Web

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          if [ -d /root/.config/godot ]; then mv /root/.config/godot ~/.config/godot; fi
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
          fi

      - name: Import and validate project
        run: |
          godot --headless --editor --quit --path . > import.log 2>&1
          status=$?
          cat import.log
          [ $status -eq 0 ]
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|GLB.*(error|warning)|glTF.*(error|warning)|ERROR:.*(glb|gltf|import)|WARNING:.*(LOD|normal|glb|gltf|import)" import.log; then
            echo "Godot script validation failed."
            exit 1
          fi

      - name: Validate real terrain geometry
        run: |
          godot --headless --path . --script scripts/validate_terrain.gd > terrain-validation.log 2>&1
          status=$?
          cat terrain-validation.log
          [ $status -eq 0 ]
          grep -F "TERRAIN_VALIDATION_OK" terrain-validation.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:" terrain-validation.log; then
            echo "Terrain geometry validation contains errors."
            exit 1
          fi

      - name: Validate continuous siege route
        run: |
          godot --headless --path . --script scripts/validate_siege_route.gd > siege-route-validation.log 2>&1
          status=$?
          cat siege-route-validation.log
          [ $status -eq 0 ]
          grep -F "SIEGE_ROUTE_VALIDATION_OK" siege-route-validation.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:" siege-route-validation.log; then
            echo "Siege route validation contains errors."
            exit 1
          fi

      - name: Validate castle anchor stage
        run: |
          godot --headless --path . --script scripts/validate_castle_anchors.gd > castle-anchor-validation.log 2>&1
          status=$?
          cat castle-anchor-validation.log
          [ $status -eq 0 ]
          grep -F "CASTLE_ANCHOR_VALIDATION_OK" castle-anchor-validation.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:" castle-anchor-validation.log; then
            echo "Castle anchor validation contains errors."
            exit 1
          fi

      - name: Export and validate Web build
        run: |
          mkdir -p build/web
          godot --headless --verbose --path . --export-release "Web" build/web/index.html > export.log 2>&1
          status=$?
          cat export.log
          [ $status -eq 0 ]
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|GLB.*(error|warning)|glTF.*(error|warning)|ERROR:.*(glb|gltf|import)|WARNING:.*(LOD|normal|glb|gltf|import)" export.log; then
            echo "Godot export contains script errors."
            exit 1
          fi
          test -s build/web/index.html
          touch build/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
